{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4>Upload CSV Dataset</h4>
        <form method="post" enctype="multipart/form-data">
          {{ form.hidden_tag() }}
          <div class="mb-3">{{ form.dataset.label(class_='form-label') }}{{ form.dataset(class_='form-control') }}</div>
          {{ form.submit(class_='btn btn-primary') }}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
